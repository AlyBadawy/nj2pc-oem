# Connection details for the PostgreSQL server already running in this k3s
# cluster (or wherever it lives) — this Secret does NOT deploy a database,
# it only tells the backend how to reach one that already exists.
# Fill in real values per-environment and apply — do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: nj2pc-oem-db
  namespace: nj2pc-oem
type: Opaque
stringData:
  DB_HOST: "your-postgres-host"
  DB_PORT: "5432"
  DB_NAME: "nj2pc_oem"
  DB_USER: "nj2pc_oem"
  DB_PASSWORD: "changeme"
  JWT_SECRET: "change-this-to-a-long-random-value"
