# Pulled from the cluster's Vault via External Secrets Operator, mirroring
# hl-beta's other apps (e.g. immich-secret): DB_USER/DB_PASSWORD come from
# the same `nj2pc-oem-db` Vault key that hl-beta's db/init-job.yaml uses to
# create the Postgres role + database on the shared server, and JWT_SECRET
# comes from a separate `nj2pc-oem` Vault key. DB_HOST/DB_PORT/DB_NAME are
# not secret, so they're set directly as env vars on the backend Deployment.
#
# Each remoteRef spells out conversionStrategy/decodingStrategy/
# metadataPolicy/nullBytePolicy explicitly, even though they're the API's
# own defaults — the external-secrets CRD fills them in server-side on
# whatever gets applied, and omitting them here left ArgoCD permanently
# OutOfSync comparing our unset fields against the live defaulted object.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nj2pc-oem-secret
  namespace: hams
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: k8s-secrets
    kind: ClusterSecretStore
  target:
    name: nj2pc-oem-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: nj2pc-oem-db
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: DB_PASSWORD
      remoteRef:
        key: nj2pc-oem-db
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: JWT_SECRET
      remoteRef:
        key: nj2pc-oem
        property: jwt-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
