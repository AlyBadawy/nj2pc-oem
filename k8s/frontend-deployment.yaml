apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hams
  labels:
    app.kubernetes.io/name: nj2pc-oem-frontend
    homelab/stack: nj2pc-oem
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nj2pc-oem-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nj2pc-oem-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/alybadawy/nj2pc-oem-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
