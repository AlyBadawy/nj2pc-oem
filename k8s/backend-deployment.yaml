apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: hams
  labels:
    app.kubernetes.io/name: nj2pc-oem-backend
    homelab/stack: nj2pc-oem
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # Recreate, not RollingUpdate: the ReadWriteOnce storage PVC below can only be mounted by one
  # pod at a time, so a surge pod for a rolling update would fail to schedule while the old pod
  # still holds it. This trades a brief window of downtime per deploy for a reliable rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nj2pc-oem-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nj2pc-oem-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/alybadawy/nj2pc-oem-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: nj2pc-oem-secret
          env:
            - name: DB_HOST
              value: postgres.db.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: nj2pc_oem
            - name: STORAGE_DIR
              value: /data
          volumeMounts:
            - name: storage
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: nj2pc-oem-storage
